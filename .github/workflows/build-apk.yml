name: Build and Release QuizVerse APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Environment
        run: flutter --version

      - name: Install Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build Release APK
        working-directory: mobile
        run: flutter build apk --release --dart-define=USE_LOCAL_BACKEND=false

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: quizverse-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: 'QuizVerse v1.0.0 Release'
          body: |
            ## 🚀 QuizVerse Official Android Release (v1.0.0)
            
            Hosted backend: https://quiz-game-olive-three.vercel.app/
            
            ### What's included:
            - **The Ring**: Realtime competitive multiplayer & 1v1 duels.
            - **Curriculum Journey**: Economics & GATE CS learning tracks.
            - **Quiz Masters**: Verified creators & mentors.
            - **Tournaments Hub**: Daily sprints and knockout cups.
            - **Player Archetypes & Badges**: Speedster, Strategist, Clutcher.
            
            Download `quizverse-release.apk` below and install directly on your Android device.
          files: mobile/build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
