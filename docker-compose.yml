version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: quizapp-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: quizapp

  redis:
    image: redis:7.2-alpine
    container_name: quizapp-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quizapp-backend
    restart: always
    ports:
      - "5001:5001"
    environment:
      PORT: 5001
      NODE_ENV: development
      MONGODB_URI: mongodb://mongodb:27017/quizapp
      REDIS_URL: redis://redis:6379
      JWT_SECRET: super_secret_quiz_jwt_key_2026_change_in_production
      CORS_ORIGIN: "*"
    depends_on:
      - mongodb
      - redis

volumes:
  mongo_data:
  redis_data:
